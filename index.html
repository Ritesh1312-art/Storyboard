
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryBoard - Develop by Ritesh Gupta</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-glow: conic-gradient(from 180deg at 50% 50%, #2a8af6 0deg, #a853ba 180deg, #e92a67 360deg);
        --neon-purple: #a853ba;
        --neon-blue: #2a8af6;
      }
      
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #020005;
        color: #e2e8f0;
        overflow-x: hidden;
        margin: 0;
      }

      select option {
        background-color: #0f0f16;
        color: white;
        padding: 10px;
      }

      @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      .magic-border {
        position: relative;
        background: rgba(15, 15, 22, 0.6);
        z-index: 1;
        border-radius: inherit;
      }

      .magic-border::after, .magic-border::before {
        content: '';
        position: absolute;
        height: calc(100% + 4px);
        width: calc(100% + 4px);
        background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-blue));
        background-size: 200% 200%;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        z-index: -1;
        border-radius: inherit;
        opacity: 0.3;
        transition: opacity 0.3s;
      }
      
      .magic-border::before {
        filter: blur(1.5rem);
        opacity: 0.2;
      }

      .magic-border:hover::after {
        opacity: 0.5;
      }

      .pointer-trail {
        position: fixed;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: screen;
        box-shadow: 0 0 10px 2px rgba(100, 200, 255, 0.8);
        transition: opacity 0.5s ease;
      }

      .stars-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: radial-gradient(circle at center top, #0a0a1a 0%, #000000 100%);
        overflow: hidden;
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0.2;
        pointer-events: none;
        filter: drop-shadow(0 0 5px white);
        animation: blink var(--duration) infinite ease-in-out;
        animation-delay: var(--delay);
      }

      @keyframes blink {
        0%, 100% { 
          opacity: 0.1; 
          transform: scale(0.5); 
          filter: blur(1px);
        }
        50% { 
          opacity: 1; 
          transform: scale(1.4); 
          box-shadow: 0 0 15px 2px rgba(255, 255, 255, 0.8);
          filter: blur(0px);
        }
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #2a8af6, #a853ba); border-radius: 10px; }

      #btn-inner:hover {
        border-color: rgba(255, 0, 255, 0.8) !important;
        transform: scale(1.05);
      }
      #btn-inner:active {
        transform: scale(0.95);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "@google/genai": "https://esm.sh/@google/genai",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.3.1",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?deps=react@18.3.1,react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/"
  }
}
</script>
  <script type="module" src="/index.tsx"></script>
  </head>
  <body>
    <div id="arcane-back-btn" style="position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:999999; cursor:move; user-select:none; touch-action:none;">
      <button onclick="if(!isDragging) window.history.back()" id="btn-inner" style="background:rgba(15,5,30,0.85); backdrop-filter:blur(12px); padding:10px 24px; border-radius:50px; color:#fff; border:1px solid rgba(255,0,255,0.3); font-family:sans-serif; font-size:10px; letter-spacing:3px; box-shadow:0 10px 40px rgba(0,0,0,0.9); display:flex; align-items:center; gap:10px; pointer-events:auto; transition: transform 0.2s, border-color 0.3s; white-space:nowrap; text-transform: uppercase; font-weight: bold;">
        <span style="font-size:16px; line-height:1;">←</span> Back
      </button>
    </div>

    <div class="stars-container" id="starsContainer"></div>
    <div id="root"></div>

    <script>
      const container = document.getElementById('starsContainer');
      const starCount = 300; 
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() < 0.1 ? (Math.random() * 3 + 1) : (Math.random() * 1.5 + 0.5);
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const duration = Math.random() * 2 + 1; 
        const delay = Math.random() * -10; 
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${x}%`;
        star.style.top = `${y}%`;
        star.style.setProperty('--duration', `${duration}s`);
        star.style.setProperty('--delay', `${delay}s`);
        container.appendChild(star);
      }

      const dragItem = document.getElementById("arcane-back-btn");
      let active = false;
      let currentX = 0;
      let currentY = 0;
      let initialX;
      let initialY;
      let xOffset = 0;
      let yOffset = 0;
      let isDragging = false;

      dragItem.addEventListener("touchstart", dragStart, false);
      dragItem.addEventListener("touchend", dragEnd, false);
      dragItem.addEventListener("touchmove", drag, false);
      dragItem.addEventListener("mousedown", dragStart, false);
      dragItem.addEventListener("mouseup", dragEnd, false);
      dragItem.addEventListener("mousemove", drag, false);

      function dragStart(e) {
        if (e.type === "touchstart") {
          initialX = e.touches[0].clientX - xOffset;
          initialY = e.touches[0].clientY - yOffset;
        } else {
          initialX = e.clientX - xOffset;
          initialY = e.clientY - yOffset;
        }
        active = true;
        isDragging = false;
      }

      function dragEnd(e) {
        initialX = currentX;
        initialY = currentY;
        active = false;
        setTimeout(() => { isDragging = false; }, 100);
      }

      function drag(e) {
        if (active) {
          e.preventDefault();
          isDragging = true;
          if (e.type === "touchmove") {
            currentX = e.touches[0].clientX - initialX;
            currentY = e.touches[0].clientY - initialY;
          } else {
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
          }
          xOffset = currentX;
          yOffset = currentY;
          dragItem.style.transform = "translate3d(" + (currentX - dragItem.offsetWidth/2) + "px, " + currentY + "px, 0)";
          dragItem.style.left = "50%"; 
        }
      }

      document.addEventListener('mousemove', function(e) {
        const trail = document.createElement('div');
        trail.className = 'pointer-trail';
        // USE clientX AND clientY BECAUSE THE TRAIL IS position: fixed
        trail.style.left = e.clientX + 'px';
        trail.style.top = e.clientY + 'px';
        const hue = (Date.now() / 10) % 360;
        trail.style.backgroundColor = `hsl(${hue}, 80%, 70%)`;
        trail.style.boxShadow = `0 0 10px 3px hsl(${hue}, 80%, 60%)`;
        document.body.appendChild(trail);
        trail.animate([
          { transform: 'scale(1)', opacity: 1 },
          { transform: 'scale(0)', opacity: 0 }
        ], { duration: 600, easing: 'ease-out' }).onfinish = () => trail.remove();
      });
    </script>
  </body>
</html>
